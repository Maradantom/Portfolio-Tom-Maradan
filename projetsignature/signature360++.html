<!DOCTYPE html>

<head>

  <meta name="keywords" content="visite 360, projet signature, airhub, architecture, visite virtuelle, immersion">

  <title>Visite 360° - Projet Signature Airhub | Studio TM</title>
  
  <!-- Preload critical resources -->
  <link rel="preload" href="photo/logo/Noir long.webp" as="image">
  <link rel="preload" href="photo/visite360/prieuré/edl/plans/planRDC.webp" as="image">
  
  <!-- DNS prefetch for external resources -->
  <link rel="dns-prefetch" href="//cdn.jsdelivr.net">
  
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pannellum/build/pannellum.css"/>
  <script src="https://cdn.jsdelivr.net/npm/pannellum/build/pannellum.js" defer></script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: sans-serif;
      background: #ffffff url('photo/logo/Noir long.webp') center center no-repeat;
      background-size: 200px;
      touch-action: none;
    }

    /* Panorama 360° */
    #panorama {
      width: 100%;
      height: 100%;
      display: none; /* masqué au départ */
    }

    /* --- Plan plein écran --- */
    #plan-fullscreen {
      position: absolute;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #fff;
      transition: opacity 0.8s ease;
      z-index: 10;
      touch-action: none;
    }
    #plan-fullscreen img {
      width: 95%;
      max-width: 95vw;
      max-height: 95vh;
      border-radius: 10px;
      box-shadow: 0 0 30px rgba(0,0,0,0.3);
      position: relative;
      object-fit: contain;
    }
    .zone {
      position: absolute;
      width: 20px;
      height: 20px;
      background: rgba(0,0,0,0.4);
      border: 2px solid white;
      border-radius: 50%;
      cursor: pointer;
      transition: transform 0.2s;
      /* Styles pour les boutons accessibles */
      color: transparent;
      font-size: 0;
      outline: 2px solid transparent;
      outline-offset: 2px;
    }
    .zone:hover { transform: scale(1.2); }
    .zone:focus {
      outline: 2px solid #007acc;
      outline-offset: 2px;
    }

    /* Plan réduit - Position fixe en bas à droite */
    #plan-mini {
      position: absolute;
      bottom: 20px;
      right: 20px;
      width: 200px;
      background: rgba(255,255,255,0.9);
      border-radius: 10px;
      padding: 8px;
      display: none;
      z-index: 5;
      transition: all 0.3s ease;
    }
    
    #plan-mini:hover {
      transform: scale(1.4);
      transform-origin: bottom right;
      opacity: 1;
    }
    #plan-mini img { 
      width: 100%; 
      border-radius: 8px;
    }
    #plan-mini .zone {
      width: 8px;
      height: 8px;
      border: 1px solid white;
    }

    /* --- Hotspot miniature --- */
    .mini-thumb img {
      width: 60px;
      height: 60px;
      border-radius: 5px;
      border: 2px solid white;
      cursor: pointer;
      transition: transform 0.2s;
    }
    .mini-thumb img:hover { transform: scale(1.2); }

    /* Animation de fondu */
    .fade-out { opacity: 0; pointer-events: none; }

    /* Masquer l'indicateur de chargement */
    .pnlm-load-box {
      display: none !important;
    }
    
    /* Transition fluide pour le canvas */
    .pnlm-render-container {
      transition: opacity 0.8s ease !important;
    }

    /* Fond personnalisé avec logo */
    .pnlm-container {
      background: #000 url('photo/logo.png') center center no-repeat !important;
      background-size: 200px !important;
    }

    /* Écran d'accueil */
    #welcome-screen {
      position: absolute;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #424546 0%, #DEE0E2 100%);
      z-index: 15;
      color: white;
      text-align: center;
    }
    
    .welcome-logo {
      width: 200px;
      height: 200px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 30px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.3);
      animation: pulse 2s infinite;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      overflow: hidden;
      /* CHANGEZ L'IMAGE ICI : */
      background-image: url('photo/visite360/prieuré/projet/preview/ext.webp');
    }
    
    .welcome-logo img {
      display: none;
    }
    
    @keyframes pulse {
      0% { transform: scale(1); box-shadow: 0 20px 40px rgba(0,0,0,0.3); }
      50% { transform: scale(1.05); box-shadow: 0 25px 50px rgba(0,0,0,0.4); }
      100% { transform: scale(1); box-shadow: 0 20px 40px rgba(0,0,0,0.3); }
    }
    
    .welcome-title {
      font-size: 2.5em;
      font-weight: 300;
      margin-bottom: 15px;
      opacity: 0;
      animation: fadeInUp 1s ease 0.5s forwards;
    }
    
    .welcome-subtitle {
      font-size: 1.2em;
      opacity: 0.9;
      margin-bottom: 40px;
      opacity: 0;
      animation: fadeInUp 1s ease 1s forwards;
    }
    
    .enter-btn {
      padding: 15px 40px;
      background: rgba(255,255,255,0.2);
      border: 2px solid white;
      border-radius: 50px;
      color: white;
      font-size: 1.1em;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.3s ease;
      opacity: 0;
      animation: fadeInUp 1s ease 1.5s forwards;
      backdrop-filter: blur(10px);
    }
    
    .enter-btn:hover {
      background: white;
      color: #272727;
      transform: translateY(-2px);
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    }
    
    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    
    .loading-dots {
      display: flex;
      gap: 8px;
      margin-top: 20px;
    }
    
    .dot {
      width: 12px;
      height: 12px;
      background: white;
      border-radius: 50%;
      animation: bounce 1.4s infinite ease-in-out;
    }
    
    .dot:nth-child(1) { animation-delay: -0.32s; }
    .dot:nth-child(2) { animation-delay: -0.16s; }
    
    @keyframes bounce {
      0%, 80%, 100% {
        transform: scale(0.8);
        opacity: 0.5;
      }
      40% {
        transform: scale(1);
        opacity: 1;
      }
    }

    /* Section Vidéo - Plein écran sans barre */
    #video-section {
      position: absolute;
      top: 0; left: 0;
      width: 100%;
      height: 100vh; /* Toujours pleine hauteur */
      display: none;
      align-items: center;
      justify-content: center;
      background: #000;
      z-index: 10;
    }
    #video-section video {
      width: 88%;
      max-width: 88vw;
      max-height:88vw;
      border-radius: 10px;
    }
    #video-close {
      position: absolute;
      top: 20px;
      right: 20px;
      background: rgba(255,255,255,0.9);
      border: none;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      cursor: pointer;
      font-size: 20px;
      z-index: 11;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #000;
    }

    /* Section Image Samplesroom */
    #samplesroom-section {
      position: absolute;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
      display: none;
      align-items: center;
      justify-content: center;
      background: #000;
      z-index: 10;
    }
    #samplesroom-section img {
      width: 90%;
      max-width: 90vw;
      max-height: 90vh;
      border-radius: 10px;
      object-fit: contain;
    }
    #samplesroom-close {
      position: absolute;
      top: 20px;
      right: 20px;
      background: rgba(255,255,255,0.9);
      border: none;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      cursor: pointer;
      font-size: 20px;
      z-index: 11;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #000;
    }
    .nav-square {
      position: absolute;
      width: 60px;
      height: 60px;
      z-index: 11;
      overflow: hidden;
      border-radius: 5px;
      border: 2px solid white;
    }
    .nav-square img {
      width: 64px;
      height: 64px;
      border-radius: 3px;
      cursor: pointer;
      transition: transform 0.2s;
      object-fit: cover;
      display: block;
    }
    .nav-square img:hover {
      transform: scale(1.2);
    }
    /* MODIFIEZ CES VALEURS POUR CHANGER LA POSITION DES CARRÉS */
    #nav-exterieur3 {
      top: 50%;  
      left: 10%; 
    }
    #nav-yoga {
      top: 50%;   
      right: 10%; 
    }

    /* Ancien sélecteur d'étage - maintenant masqué */
    #floor-selector {
      display: none !important;
    }
    .floor-btn {
      display: none;
    }

    /* Barre de navigation permanente */
    #main-navigation {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 70px;
      background: rgba(255,255,255,0.95);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(0,0,0,0.1);
      display: none; /* Masquée au départ */
      align-items: center;
      justify-content: center;
      z-index: 100;
      box-shadow: 0 2px 20px rgba(0,0,0,0.1);
      opacity: 0;
      transform: translateY(-70px);
      transition: all 0.8s ease;
    }
    
    #main-navigation.show {
      display: flex;
      opacity: 1;
      transform: translateY(0);
    }
    
    /* Mode transparent pour les photos 360° */
    #main-navigation.transparent {
      background: transparent !important;
      backdrop-filter: none !important;
      border-bottom: none !important;
      box-shadow: none !important;
    }
    
    /* Animation de disparition pour la vidéo */
    #main-navigation.hide {
      opacity: 0;
      transform: translateY(-70px);
    }
    
    #navigation-content {
      display: flex;
      align-items: center;
      gap: 30px;
    }
    
    /* Toggle Avant projet / Projet - Style adapté pour mode transparent */
    #mode-toggle {
      display: flex;
      background: rgba(0,0,0,0.05);
      border-radius: 50px;
      padding: 4px;
      gap: 0;
      transition: all 0.3s ease;
    }
    
    #main-navigation.transparent #mode-toggle {
      background: rgba(0,0,0,0.7);
      backdrop-filter: blur(10px);
    }
    
    .mode-btn {
      padding: 12px 24px;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      background: transparent;
      color: #666;
      transition: all 0.3s ease;
      white-space: nowrap;
      min-width: 120px;
    }
    
    #main-navigation.transparent .mode-btn {
      color: rgba(255,255,255,0.8);
    }
    
    .mode-btn.active {
      background: #333;
      color: white;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
    }
    
    #main-navigation.transparent .mode-btn.active {
      background: rgba(255,255,255,0.9);
      color: #333;
    }
    
    /* Sélecteur d'étage - Style adapté pour mode transparent */
    #floor-navigation {
      display: flex;
      gap: 8px;
    }
    .floor-nav-btn {
      padding: 8px 16px;
      background: rgba(0,0,0,0.05);
      border: 2px solid transparent;
      border-radius: 25px;
      cursor: pointer;
      font-weight: 600;
      font-size: 13px;
      color: #666;
      transition: all 0.3s ease;
      min-width: 50px;
      text-align: center;
    }
    
    #main-navigation.transparent .floor-nav-btn {
      background: rgba(0,0,0,0.7);
      color: rgba(255,255,255,0.8);
      backdrop-filter: blur(10px);
    }
    
    .floor-nav-btn:hover {
      background: rgba(0,0,0,0.1);
      transform: translateY(-1px);
    }
    
    #main-navigation.transparent .floor-nav-btn:hover {
      background: rgba(0,0,0,0.8);
      color: white;
    }
    
    .floor-nav-btn.active {
      background: #333;
      color: white;
      border-color: #333;
    }
    
    #main-navigation.transparent .floor-nav-btn.active {
      background: rgba(255,255,255,0.9);
      color: #333;
      border-color: rgba(255,255,255,0.9);
    }
    
    /* Bouton vidéo dans la navigation - Style adapté pour mode transparent */
    #video-nav-btn {
      padding: 8px 16px;
      background: linear-gradient(135deg, #6b7280 0%, #4b5563 100%);
      border: none;
      border-radius: 25px;
      cursor: pointer;
      font-weight: 600;
      font-size: 13px;
      color: white;
      transition: all 0.3s ease;
      box-shadow: 0 2px 8px rgba(107, 114, 128, 0.3);
      position: relative;
      overflow: hidden;
    }
    
    #main-navigation.transparent #video-nav-btn {
      background: linear-gradient(135deg, rgba(0,0,0,0.7) 0%, rgba(0,0,0,0.8) 100%);
      backdrop-filter: blur(10px);
    }
    
    #video-nav-btn::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
      transition: left 0.5s;
    }
    
    #video-nav-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 15px rgba(107, 114, 128, 0.4);
      background: linear-gradient(135deg, #374151 0%, #1f2937 100%);
    }
    
    #main-navigation.transparent #video-nav-btn:hover {
      background: linear-gradient(135deg, rgba(0,0,0,0.8) 0%, rgba(0,0,0,0.9) 100%);
    }
    
    #video-nav-btn:hover::before {
      left: 100%;
    }
    
    #video-nav-btn:active {
      transform: translateY(0);
      box-shadow: 0 2px 8px rgba(107, 114, 128, 0.3);
    }
    
    /* Ajustement du contenu pour la barre fixe */
    body {
      padding-top: 0; /* Pas de padding au départ */
      transition: padding-top 0.8s ease;
    }
    
    body.navigation-visible {
      padding-top: 70px;
    }
    
    #plan-fullscreen,
    #panorama,
    #samplesroom-section {
      height: 100vh; /* Pleine hauteur au départ */
      top: 0;
      transition: all 0.8s ease;
    }
    
    body.navigation-visible #plan-fullscreen,
    body.navigation-visible #panorama,
    body.navigation-visible #samplesroom-section {
      height: calc(100vh - 70px);
      top: 70px;
    }
    
    /* La vidéo reste toujours en plein écran */
    #video-section {
      height: 100vh !important;
      top: 0 !important;
    }
    
    #welcome-screen {
      height: 100vh;
      top: 0;
    }

    /* Boutons flottants pour les visites 360° */
    #floating-controls {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 30px;
      z-index: 100;
      opacity: 0;
      transition: opacity 0.3s ease;
    }
    
    #floating-controls.show {
      opacity: 1;
    }
    
    #floating-mode-toggle {
      display: flex;
      background: rgba(0,0,0,0.7);
      border-radius: 50px;
      padding: 4px;
      gap: 0;
      backdrop-filter: blur(10px);
    }
    
    .floating-mode-btn {
      padding: 12px 24px;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      background: transparent;
      color: rgba(255,255,255,0.8);
      transition: all 0.3s ease;
      white-space: nowrap;
      min-width: 120px;
    }
    
    .floating-mode-btn.active {
      background: rgba(255,255,255,0.9);
      color: #333;
    }
    
    #floating-floor-navigation {
      display: flex;
      gap: 8px;
    }
    
    .floating-floor-btn {
      padding: 8px 16px;
      background: rgba(0,0,0,0.7);
      border: 2px solid transparent;
      border-radius: 25px;
      cursor: pointer;
      font-weight: 600;
      font-size: 13px;
      color: rgba(255,255,255,0.8);
      transition: all 0.3s ease;
      min-width: 50px;
      text-align: center;
      backdrop-filter: blur(10px);
    }
    
    .floating-floor-btn:hover {
      background: rgba(0,0,0,0.8);
      color: white;
    }
    
    .floating-floor-btn.active {
      background: rgba(255,255,255,0.9);
      color: #333;
      border-color: rgba(255,255,255,0.9);
    }
    
    #floating-video-btn {
      padding: 8px 16px;
      background: linear-gradient(135deg, rgba(0,0,0,0.7) 0%, rgba(0,0,0,0.8) 100%);
      border: none;
      border-radius: 25px;
      cursor: pointer;
      font-weight: 600;
      font-size: 13px;
      color: white;
      transition: all 0.3s ease;
      backdrop-filter: blur(10px);
    }
    
    #floating-video-btn:hover {
      background: linear-gradient(135deg, rgba(0,0,0,0.8) 0%, rgba(0,0,0,0.9) 100%);
      transform: translateY(-2px);
    }

    /* Bouton gyroscope */
    #gyro-btn {
      position: absolute;
      bottom: 20px;
      left: 20px;
      width: 44px;
      height: 44px;
      background: rgba(255,255,255,0.9);
      border: none;
      border-radius: 50%;
      cursor: pointer;
      font-size: 22px;
      z-index: 6;
      display: none;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
    }
    #gyro-btn.active {
      background: #333;
      color: white;
    }

    /* Responsive Mobile */
    @media (max-width: 768px) {
      html, body {
        width: 100vw;
        min-width: 100vw;
        max-width: 100vw;
        overflow-x: hidden;
      }
      
      /* Navigation mobile */
      #main-navigation {
        height: 60px;
        padding: 0 10px;
      }
      
      #navigation-content {
        gap: 15px;
        flex-wrap: wrap;
        justify-content: center;
      }
      
      .mode-btn {
        padding: 8px 16px;
        font-size: 12px;
        min-width: 100px;
      }
      
      #floor-navigation {
        gap: 4px;
      }
      
      .floor-nav-btn {
        padding: 6px 12px;
        font-size: 11px;
        min-width: 40px;
      }
      
      #video-nav-btn {
        padding: 6px 12px;
        font-size: 11px;
      }
      
      #video-nav-btn::before {
        display: none; /* Pas d'effet shimmer sur mobile */
      }
      
      /* Ajustement du contenu */
      body {
        padding-top: 0;
      }
      
      body.navigation-visible {
        padding-top: 60px;
      }
      
      #plan-fullscreen,
      #panorama,
      #samplesroom-section {
        height: 100vh;
        top: 0;
      }
      
      body.navigation-visible #plan-fullscreen,
      body.navigation-visible #panorama,
      body.navigation-visible #samplesroom-section {
        height: calc(100vh - 60px);
        top: 60px;
      }
      
      /* La vidéo reste toujours en plein écran sur mobile */
      #video-section {
        height: 100vh !important;
        top: 0 !important;
      }
      
      .mini-thumb img {
        width: 35px;
        height: 35px;
      }
      #plan-fullscreen {
        width: 100vw;
        min-width: 100vw;
        max-width: 100vw;
      }
      /* Plan réduit mobile - Position fixe en bas à droite */
      #plan-mini {
        width: 140px;
        bottom: 10px;
        right: 10px;
        padding: 6px;
        transition: all 0.3s ease;
      }
      
      #plan-mini:hover {
        transform: scale(1.3);
        transform-origin: bottom right;
        opacity: 1;
      }
      #plan-mini img {
        pointer-events: none;
      }
      #plan-mini .zone {
        width: 12px;
        height: 12px;
        border: 2px solid white;
      }
      #plan-fullscreen .zone {
        width: 18px;
        height: 18px;
        border: 2px solid white;
      }
      #plan-fullscreen {
        padding: 5px;
        box-sizing: border-box;
      }
      #plan-fullscreen img {
        width: 95%;
        height: auto;
        max-width: 95vw;
        max-height: 85vh;
        margin: 0 auto;
        display: block;
        transform: translateX(0);
      }
      #video-close {
        color: #000;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      
      .welcome-title {
        font-size: 2em;
      }
      
      .welcome-subtitle {
        font-size: 1em;
        margin-bottom: 30px;
      }
      
      .welcome-logo {
        width: 150px;
        height: 150px;
        margin-bottom: 20px;
      }
      
      .enter-btn {
        padding: 12px 30px;
        font-size: 1em;
      }
    }
  </style>
</head>
<body>

  <!-- Boutons flottants pour les visites 360° -->
  <div id="floating-controls" style="display: none;" role="navigation" aria-label="Contrôles de navigation 360°">

  <script>
    // Configuration des chemins selon le mode
    const CONFIG = {
      edl: {
        basePath: 'photo/visite360/prieuré/edl/',
        plans: {
          rdc: 'photo/visite360/prieuré/edl/plans/planRDC.webp',
          r1: 'photo/visite360/prieuré/edl/plans/planR+1.webp',
          rdj: 'photo/visite360/prieuré/edl/plans/planRDJ.webp'
        },
        video: 'photo/visite360/prieuré/edl/360/FPV16-9.mp4'
      },
      projet: {
        basePath: 'photo/visite360/prieuré/projet/',
        plans: {
          rdc: 'photo/visite360/prieuré/projet/plans/planRDC.webp',
          r1: 'photo/visite360/prieuré/projet/plans/planR+1.webp',
          rdj: 'photo/visite360/prieuré/projet/plans/planRDJ.webp'
        },
        video: 'photo/visite360/prieuré/projet/video/FPV16-9.mp4'
      }
    };
    
    let currentMode = 'edl';
    let currentFloor = 'rdc';
    let gyroActive = false;
    let viewer;
    
    // Fonction pour obtenir le chemin d'une image 360°
    function get360Path(sceneName) {
      return CONFIG[currentMode].basePath + '360/' + sceneName + '.webp';
    }
    
    // Fonction pour obtenir le chemin d'une image preview
    function getPreviewPath(sceneName) {
      return CONFIG[currentMode].basePath + 'preview/' + sceneName + '.webp';
    }
    
    // Fonction pour obtenir le chemin d'un plan
    function getPlanPath(floor) {
      return CONFIG[currentMode].plans[floor];
    }

    // Fonction d'entrée sur le site
    function enterSite() {
      const welcomeScreen = document.getElementById('welcome-screen');
      const enterBtn = document.querySelector('.enter-btn');
      const loadingDots = document.getElementById('loading-dots');
      
      // Masquer le bouton et afficher le chargement
      enterBtn.style.display = 'none';
      loadingDots.style.display = 'flex';
      
      // Simuler un temps de chargement pour l'effet
      setTimeout(() => {
        welcomeScreen.style.opacity = '0';
        welcomeScreen.style.transition = 'opacity 0.8s ease';
        
        setTimeout(() => {
          welcomeScreen.style.display = 'none';
          
          // Afficher la barre de navigation avec animation
          showNavigation();
          
          // Afficher le plan après l'animation de la barre
          setTimeout(() => {
            showPlan();
          }, 400);
        }, 800);
      }, 1500);
    }

    // Afficher la barre de navigation avec animation
    function showNavigation() {
      const navigation = document.getElementById('main-navigation');
      const body = document.body;
      
      // Réinitialiser le display si nécessaire
      navigation.style.display = 'flex';
      
      // Forcer un reflow pour que l'animation fonctionne
      navigation.offsetHeight;
      
      // Afficher la navigation
      navigation.classList.add('show');
      body.classList.add('navigation-visible');
    }

    // Masquer la barre de navigation avec animation
    function hideNavigation() {
      const navigation = document.getElementById('main-navigation');
      const body = document.body;
      
      navigation.classList.remove('show');
      body.classList.remove('navigation-visible');
    }

    // Afficher les boutons flottants
    function showFloatingControls() {
      const floatingControls = document.getElementById('floating-controls');
      floatingControls.style.display = 'flex';
      setTimeout(() => {
        floatingControls.classList.add('show');
      }, 100);
      updateFloatingInterface();
    }
    
    // Masquer les boutons flottants
    function hideFloatingControls() {
      const floatingControls = document.getElementById('floating-controls');
      floatingControls.classList.remove('show');
      setTimeout(() => {
        floatingControls.style.display = 'none';
      }, 300);
    }
    
    // Mettre à jour l'interface des boutons flottants
    function updateFloatingInterface() {
      // Mettre à jour les boutons de mode
      document.querySelectorAll('.floating-mode-btn').forEach(btn => {
        btn.classList.remove('active');
        btn.setAttribute('aria-pressed', 'false');
      });
      const targetMode = currentMode === 'edl' ? 'edl' : 'projet';
      const activeBtn = document.querySelector(`.floating-mode-btn[onclick*="'${targetMode}'"]`);
      if (activeBtn) {
        activeBtn.classList.add('active');
        activeBtn.setAttribute('aria-pressed', 'true');
      }
      
      // Mettre à jour les boutons d'étage
      document.querySelectorAll('.floating-floor-btn').forEach(btn => {
        btn.classList.remove('active');
        btn.setAttribute('aria-pressed', 'false');
      });
      const activeFloorBtn = document.querySelector(`.floating-floor-btn[onclick*="'${currentFloor}'"]`);
      if (activeFloorBtn) {
        activeFloorBtn.classList.add('active');
        activeFloorBtn.setAttribute('aria-pressed', 'true');
      }
    }

    // Fonction pour détecter mobile
    function isMobile() {
      return window.innerWidth <= 768;
    }

    // Synchronisation de l'interface selon la phase et l'étage
    function updateInterface() {
      // Mettre à jour les boutons de navigation
      document.querySelectorAll('.mode-btn').forEach(btn => {
        btn.classList.remove('active');
        btn.setAttribute('aria-pressed', 'false');
      });
      const targetMode = currentMode === 'edl' ? 'edl' : 'projet';
      const activeBtn = document.querySelector(`.mode-btn[onclick*="'${targetMode}'"]`);
      if (activeBtn) {
        activeBtn.classList.add('active');
        activeBtn.setAttribute('aria-pressed', 'true');
      }
      
      document.querySelectorAll('.floor-nav-btn').forEach(btn => {
        btn.classList.remove('active');
        btn.setAttribute('aria-pressed', 'false');
      });
      const activeFloorBtn = document.querySelector(`.floor-nav-btn[onclick*="'${currentFloor}'"]`);
      if (activeFloorBtn) {
        activeFloorBtn.classList.add('active');
        activeFloorBtn.setAttribute('aria-pressed', 'true');
      }
      
      // Mettre à jour les plans
      updatePlans();
    }

    // Gestion des erreurs d'images manquantes
    function handleImageError(imagePath, fallbackPath) {
      return new Promise((resolve) => {
        const img = new Image();
        img.onload = () => resolve(imagePath);
        img.onerror = () => {
          console.warn(`Image non trouvée: ${imagePath}, utilisation de: ${fallbackPath}`);
          resolve(fallbackPath);
        };
        img.src = imagePath;
      });
    }

    // Mettre à jour tous les plans selon la phase et l'étage avec gestion d'erreur
    async function updatePlans() {
      const planPath = getPlanPath(currentFloor);
      const fallbackPath = 'photo/visite360/prieuré/edl/plans/planRDC.webp';
      
      try {
        const validPath = await handleImageError(planPath, fallbackPath);
        
        document.getElementById('plan-fullscreen-img').src = validPath;
        document.getElementById('plan-mini-img').src = validPath;
        document.getElementById('plan-mini-img-projet').src = validPath.replace('/edl/', '/projet/');
        
        updateZones();
      } catch (error) {
        console.error('Erreur lors du chargement du plan:', error);
        document.getElementById('plan-fullscreen-img').src = fallbackPath;
        document.getElementById('plan-mini-img').src = fallbackPath;
        document.getElementById('plan-mini-img-projet').src = fallbackPath.replace('/edl/', '/projet/');
        updateZones();
      }
    }

    // Mettre à jour les images de samplesroom selon le mode
    function updateSamplesroomImages() {
      document.getElementById('nav-exterieur3').querySelector('img').src = getPreviewPath('extérieur3');
      document.getElementById('nav-yoga').querySelector('img').src = getPreviewPath('yoga');
      document.querySelector('#samplesroom-section > img').src = get360Path('samplesroom');
    }

    // Mettre à jour l'affichage des zones
    function updateZones() {
      try {
        // Zones plein écran
        document.querySelectorAll('[id^="fullscreen-zones-"]').forEach(zone => zone.style.display = 'none');
        const fullscreenZoneSuffix = currentMode === 'projet' ? `-projet` : '';
        const fullscreenId = `fullscreen-zones-${currentFloor}${fullscreenZoneSuffix}`;
        const fullscreenElement = document.getElementById(fullscreenId);
        if (fullscreenElement) {
          fullscreenElement.style.display = 'block';
        }
        
        // Zones miniatures plan EDL
        const zoneRdc = document.getElementById('zones-rdc');
        const zoneR1 = document.getElementById('zones-r1');
        const zoneRdj = document.getElementById('zones-rdj');
        
        if (zoneRdc) zoneRdc.style.display = 'none';
        if (zoneR1) zoneR1.style.display = 'none';
        if (zoneRdj) zoneRdj.style.display = 'none';
        
        // Zones miniatures plan PROJET
        const zoneRdcProjét = document.getElementById('zones-rdc-projet');
        const zoneR1Projet = document.getElementById('zones-r1-projet');
        const zoneRdjProjet = document.getElementById('zones-rdj-projet');
        
        if (zoneRdcProjét) zoneRdcProjét.style.display = 'none';
        if (zoneR1Projet) zoneR1Projet.style.display = 'none';
        if (zoneRdjProjet) zoneRdjProjet.style.display = 'none';
        
        // Afficher la bonne zone selon le mode
        if (currentMode === 'projet') {
          const zoneProjet = document.getElementById(`zones-${currentFloor}-projet`);
          if (zoneProjet) zoneProjet.style.display = 'block';
        } else {
          const zoneEdl = document.getElementById(`zones-${currentFloor}`);
          if (zoneEdl) zoneEdl.style.display = 'block';
        }
      } catch (error) {
        console.error('Erreur dans updateZones():', error);
      }
    }

    // Changement de mode (edl/projet) avec gestion d'erreur
    function switchMode(mode) {
      if (mode === 'avant') mode = 'edl'; // Conversion pour compatibilité
      if (mode === currentMode) return;
      
      currentMode = mode;
      updateInterface();
      updateFloatingInterface(); // Mettre à jour aussi les boutons flottants
      updateSamplesroomImages();
      
      // Si on est dans une photo 360°, changer la scène
      if (viewer && document.getElementById('panorama').style.display === 'block') {
        const currentScene = viewer.getScene();
        const baseScene = currentScene.replace('_projet', '').replace('_edl', '');
        loadScene(baseScene);
      }
    }

    // Changement d'étage
    function switchToFloor(floor) {
      if (floor === currentFloor) return;
      
      currentFloor = floor;
      updateInterface();
      updateFloatingInterface(); // Mettre à jour aussi les boutons flottants
      
      // Si on est dans le plan plein écran, le mettre à jour
      if (document.getElementById('plan-fullscreen').style.display === 'flex') {
        // Pas besoin de faire plus, updateInterface() s'en charge
      }
      // Si on est dans une autre vue, revenir au plan
      else {
        showPlan();
      }
    }

    // Initialisation Panellum (différée)
    function initPanellum() {
      viewer = pannellum.viewer('panorama', {
        autoLoad: true,
        default: { 
          sceneFadeDuration: 1000,
          showZoomCtrl: false,
          showFullscreenCtrl: false,
          showControls: false,
          mouseZoom: true,
          orientationOnByDefault: false,
          friction: 0.15
        },


        // EDL
      scenes: {
        // RDJ - samplesroom maintenant gérée comme image normale
        yoga: {
          panorama: "photo/visite360/prieuré/edl/360/yoga.webp",
          type: "equirectangular",
          fadeInDuration: 800,
          fadeOutDuration: 800,
          hotSpots: [
            {
              pitch: 10, yaw: 60, type: "info", text: "",
              createTooltipFunc: function(div){
                div.classList.add('mini-thumb');
                div.innerHTML = `<img src="photo/visite360/prieuré/edl/preview/samplesroom.webp" alt="samplesroom">`;
              },
              clickHandlerFunc: function(){ showSamplesroom(); }
            },
            {
              pitch: 10, yaw: 40, type: "info", text: "",
              createTooltipFunc: function(div){
                div.classList.add('mini-thumb');
                div.innerHTML = `<img src="photo/visite360/prieuré/edl/preview/extérieur3.webp" alt="extérieur3">`;
              },
              clickHandlerFunc: function(){ 
                const targetScene = currentMode === 'projet' ? 'extérieur3_projet' : 'extérieur3';
                viewer.loadScene(targetScene); 
              }
            }
          ]
        },
        extérieur3 : {
          panorama: "photo/visite360/prieuré/edl/360/extérieur3.webp",
          type: "equirectangular",
          fadeInDuration: 800,
          fadeOutDuration: 800,
          hotSpots: [
            {
              pitch: -32, yaw: 5, type: "info", text: "",
              createTooltipFunc: function(div){
                div.classList.add('mini-thumb');
                div.innerHTML = `<img src="photo/visite360/prieuré/edl/preview/samplesroom.webp" alt="samplesroom">`;
              },
              clickHandlerFunc: function(){ showSamplesroom(); }
            },
            {
              pitch: -20, yaw: 25, type: "info", text: "",
              createTooltipFunc: function(div){
                div.classList.add('mini-thumb');
                div.innerHTML = `<img src="photo/visite360/prieuré/edl/preview/yoga.webp" alt="yoga">`;
              },
              clickHandlerFunc: function(){ 
                const targetScene = currentMode === 'projet' ? 'yoga_projet' : 'yoga';
                viewer.loadScene(targetScene); 
              }
            },
            {
              pitch: -17, yaw: -20, type: "info", text: "",

    // Toggle Gyroscope
    async function toggleGyro() {
      const btn = document.getElementById('gyro-btn');
      if (!gyroActive) {
        // iOS 13+ nécessite une permission explicite
        if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
          try {
            const perm = await DeviceOrientationEvent.requestPermission();
            if (perm !== 'granted') return;
          } catch(e) { return; }
        }
        gyroActive = true;
        btn.classList.add('active');
        btn.setAttribute('aria-pressed', 'true');
        if (viewer) viewer.setUpdate(true);
        // Activer l'orientation dans pannellum
        if (viewer) {
          try { viewer.startOrientation(); } catch(e) {}
        }
      } else {
        gyroActive = false;
        btn.classList.remove('active');
        btn.setAttribute('aria-pressed', 'false');
        if (viewer) {
          try { viewer.stopOrientation(); } catch(e) {}
        }
      }
    }

    // Début visite depuis le plan plein écran avec vérification
    function startVisit(scene) {
      if (!viewer) {
        initPanellum();
      }
      
      const plan = document.getElementById('plan-fullscreen');
      plan.classList.add('fade-out');
      setTimeout(() => {
        plan.style.display = 'none';
        document.getElementById('panorama').style.display = 'block';
        
        // Afficher le bon plan mini selon le mode
        const planMiniId = currentMode === 'projet' ? 'plan-mini-projet' : 'plan-mini';
        document.getElementById('plan-mini').style.display = 'none';
        document.getElementById('plan-mini-projet').style.display = 'none';
        document.getElementById(planMiniId).style.display = 'block';
        
        // Masquer la barre de navigation et afficher les boutons flottants
        hideNavigation();
        showFloatingControls();
        
        if (/Mobi|Android|iPhone|iPad/i.test(navigator.userAgent)) {
          document.getElementById('gyro-btn').style.display = 'flex';
        }
        
        // Charger la scène avec la bonne phase
        loadScene(scene);
      }, 800);
    }

    // Changement de scène depuis le plan mini avec vérification
    function loadScene(sceneName) {
      if (!viewer) {
        initPanellum();
      }
      
      const sceneKey = currentMode === 'projet' ? sceneName + '_projet' : sceneName;
      
      if (viewer.getConfig().scenes[sceneKey]) {
        viewer.loadScene(sceneKey);
      } else {
        if (viewer.getConfig().scenes[sceneName]) {
          console.warn(`Scène ${sceneKey} non trouvée, utilisation de ${sceneName}`);
          viewer.loadScene(sceneName);
        } else {
          console.error(`Aucune scène trouvée pour ${sceneName}`);
        }
      }
    }

    // Retour au plan plein écran
    function returnToFullPlan() {
      document.getElementById('panorama').style.display = 'none';
      document.getElementById('plan-mini').style.display = 'none';
      document.getElementById('plan-mini-projet').style.display = 'none';
      document.getElementById('gyro-btn').style.display = 'none';
      
      // Masquer les boutons flottants et réafficher la barre normale
      hideFloatingControls();
      showNavigation();
      
      // Attendre que la barre soit visible avant d'afficher le plan
      setTimeout(() => {
        showPlan();
      }, 600);
    }



    // Afficher le plan plein écran
    function showPlan() {
      // Masquer toutes les autres sections
      document.getElementById('video-section').style.display = 'none';
      document.getElementById('panorama').style.display = 'none';
      document.getElementById('plan-mini').style.display = 'none';
      document.getElementById('plan-mini-projet').style.display = 'none';
      document.getElementById('samplesroom-section').style.display = 'none';
      
      // Afficher le plan
      const plan = document.getElementById('plan-fullscreen');
      plan.style.display = 'flex';
      plan.classList.remove('fade-out');
      
      updateInterface();
    }

    // Afficher la vidéo
    function showVideo() {
      // Masquer toutes les autres sections
      document.getElementById('plan-fullscreen').style.display = 'none';
      document.getElementById('panorama').style.display = 'none';
      document.getElementById('plan-mini').style.display = 'none';
      document.getElementById('samplesroom-section').style.display = 'none';
      
      // Masquer la barre de navigation avec animation
      hideNavigation();
      
      const videoSection = document.getElementById('video-section');
      const video = videoSection.querySelector('video');
      const source = video.querySelector('source');
      
      // Mettre à jour le chemin de la vidéo selon le mode actuel
      source.src = CONFIG[currentMode].video;
      video.load(); // Recharger la vidéo avec le nouveau chemin
      
      video.currentTime = 0;
      videoSection.style.display = 'flex';
      video.play();
    }

    // Fermer la vidéo
    function closeVideo() {
      const videoSection = document.getElementById('video-section');
      const video = videoSection.querySelector('video');
      video.pause();
      videoSection.style.display = 'none';
      
      // Réafficher la barre de navigation avec animation
      showNavigation();
      
      // Attendre que la barre soit visible avant d'afficher le plan
      setTimeout(() => {
        showPlan();
      }, 600); // Augmenté pour laisser plus de temps à l'animation
    }

    // Initialisation au chargement de la page
    document.addEventListener('DOMContentLoaded', function() {
      // Initialiser l'interface
      updateInterface();
      updateSamplesroomImages();
      
      // Afficher le bouton gyro sur mobile
      if (/Mobi|Android|iPhone|iPad/i.test(navigator.userAgent)) {
        document.getElementById('gyro-btn').style.display = 'flex';
      }
      
      // Gestion des erreurs globales
      window.addEventListener('error', function(e) {
        console.error('Erreur détectée:', e.error);
      });
      
      // Gestion du clavier pour l'accessibilité
      document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape') {
          // Fermer les modales ouvertes
          if (document.getElementById('video-section').style.display === 'flex') {
            closeVideo();
          }
          if (document.getElementById('samplesroom-section').style.display === 'flex') {
            closeSamplesroom();
          }
        }
      });
      
      // Test de connectivité des images critiques
      const criticalImages = [
        'photo/visite360/prieuré/edl/plans/planRDC.webp',
        'photo/logo/Noir long.webp'
      ];
      
      criticalImages.forEach(imagePath => {
        const img = new Image();
        img.onerror = () => {
          console.warn(`Image critique non trouvée: ${imagePath}`);
        };
        img.src = imagePath;
      });
    });
