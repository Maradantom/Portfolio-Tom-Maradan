<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Prévisualisation Flyer – Tom Maradan</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  width: 100vw;
  height: 100vh;
  background: #ededed;
  display: flex;
  justify-content: center;
  align-items: center;
  overflow: hidden;
  font-family: 'Outfit', sans-serif;
}

/* SCÈNE CENTRÉE */
.scene {
  width: 100%;
  height: 100%;
  perspective: 1600px;
  display: flex;
  justify-content: center;
  align-items: center;
}

/* FLYER */
.flyer {
  position: relative;
  width: 900px;
  height: 350px;
  transform-style: preserve-3d;
  cursor: grab;
  touch-action: none; /* IMPORTANT POUR MOBILE */
}

/* PANNEAUX */
.panel {
  position: absolute;
  height: 350px;
  transform-style: preserve-3d;
}

/* Dimensions */
.center { width: 450px; left: 225px; }
.side   { width: 225px; }

/* Faces */
.face {
  position: absolute;
  width: 100%;
  height: 100%;
  background-size: cover;
  background-position: center;
  backface-visibility: hidden;
  box-shadow: 0 20px 45px rgba(0,0,0,0.18);
}

/* Verso */
.back {
  transform: rotateY(180deg);
}

/* Positions */
.left {
  left: 0;
  transform-origin: right center;
  transform: rotateY(25deg);
}

.right {
  right: 0;
  transform-origin: left center;
  transform: rotateY(-25deg);
}

/* === IMAGES À PERSONNALISER === */

/* Gauche */
.left .face {
  background-image: url("images/gauche-recto.jpg");
}
.left .back {
  background-image: url("images/gauche-verso.jpg");
}

/* Centre */
.center .face {
  background-image: url("images/centre-recto.jpg");
}
.center .back {
  background-image: url("images/centre-verso.jpg");
}

/* Droite */
.right .face {
  background-image: url("images/droite-recto.jpg");
}
.right .back {
  background-image: url("images/droite-verso.jpg");
}

/* RESPONSIVE SCALE */
@media (max-width: 1000px) {
  .flyer {
    transform: scale(0.8);
  }
}

@media (max-width: 700px) {
  .flyer {
    transform: scale(0.6);
  }
}

@media (max-width: 480px) {
  .flyer {
    transform: scale(0.5);
  }
}
</style>
</head>

<body>

<div class="scene">
  <div class="flyer" id="flyer">

    <!-- Demi gauche -->
    <div class="panel side left">
      <div class="face"></div>
      <div class="face back"></div>
    </div>

    <!-- Centre -->
    <div class="panel center">
      <div class="face"></div>
      <div class="face back"></div>
    </div>

    <!-- Demi droite -->
    <div class="panel side right">
      <div class="face"></div>
      <div class="face back"></div>
    </div>

  </div>
</div>

<script>
const flyer = document.getElementById('flyer');

let isDragging = false;
let startX = 0;
let startY = 0;
let rotX = -10;
let rotY = 20;

/* Applique la rotation */
function updateRotation() {
  flyer.style.transform = `rotateX(${rotX}deg) rotateY(${rotY}deg)`;
}

updateRotation();

/* ===== DESKTOP ===== */
document.addEventListener('mousedown', e => {
  isDragging = true;
  startX = e.clientX;
  startY = e.clientY;
});

document.addEventListener('mouseup', () => isDragging = false);

document.addEventListener('mousemove', e => {
  if (!isDragging) return;

  const dx = e.clientX - startX;
  const dy = e.clientY - startY;

  rotY += dx * 0.35;
  rotX -= dy * 0.35;

  updateRotation();

  startX = e.clientX;
  startY = e.clientY;
});

/* ===== MOBILE / TABLETTE ===== */
document.addEventListener('touchstart', e => {
  isDragging = true;
  startX = e.touches[0].clientX;
  startY = e.touches[0].clientY;
});

document.addEventListener('touchend', () => isDragging = false);

document.addEventListener('touchmove', e => {
  if (!isDragging) return;

  const dx = e.touches[0].clientX - startX;
  const dy = e.touches[0].clientY - startY;

  rotY -= dx * 0.35;
  rotX -= dy * 0.35;

  updateRotation();

  startX = e.touches[0].clientX;
  startY = e.touches[0].clientY;
});
</script>

</body>
</html>
