  <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@200;300;400;500;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --ink: #0a0a0a;
      --paper: #fefdfb;
      --line: rgba(255,255,255,0.15);
      --muted: rgba(255,255,255,0.7);
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
    body {
      font-family: "Nunito Sans", "Avenir Next", Avenir, "Helvetica Neue", sans-serif;
      font-weight: 300;
      color: #fff;
      background: var(--ink);
      min-height: 100dvh;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
    }
    a { color: inherit; text-decoration: none; }

    /* Fond image très sombre */
    .bg {
      position: fixed; inset: 0; z-index: -2;
      background: url('/photosite/passion-photo/dji_fly_20260730_125704_0363_1785601341574_aeb.webp') center/cover no-repeat;
      filter: grayscale(0.5) brightness(0.55);
      transform: scale(1.05);
      animation: bgZoom 18s ease-in-out infinite alternate;
    }
    .bg::after {
      content: "";
      position: absolute; inset: 0;
      background: linear-gradient(180deg, rgba(10,10,10,0.65) 0%, rgba(10,10,10,0.75) 50%, rgba(10,10,10,0.9) 100%);
    }
    @keyframes bgZoom {
      from { transform: scale(1.05); }
      to   { transform: scale(1.15); }
    }

    /* Header minimal */
    header {
      padding: 2rem clamp(1.25rem, 4vw, 3rem);
      display: flex; align-items: center; justify-content: space-between;
      z-index: 2;
    }
    .brand { display: flex; align-items: center; gap: 0.75rem; }
    .brand img { height: 22px; filter: invert(1); }
    .sig {
      position: relative; display: inline-block;
      width: 1px; height: 22px; background: #fff; overflow: hidden;
    }
    .sig::after {
      content: ""; position: absolute; inset: 0; background: var(--ink);
      animation: sigPulse 3s ease-in-out infinite;
    }
    @keyframes sigPulse {
      0%, 100% { transform: translateY(100%); }
      50%      { transform: translateY(-100%); }
    }
    .portfolio-link {
      font-size: 0.75rem; letter-spacing: 0.2em; text-transform: uppercase;
      color: var(--muted); transition: color 0.3s ease;
      padding-bottom: 2px; border-bottom: 1px solid transparent;
    }
    .portfolio-link:hover { color: #fff; border-bottom-color: #fff; }

    /* Contenu central */
    main {
      flex: 1;
      display: flex; align-items: center; justify-content: center;
      padding: 2rem clamp(1.25rem, 4vw, 3rem);
      text-align: center;
    }
    .card {
      max-width: 720px;
      opacity: 0; transform: translateY(20px);
      animation: fadeUp 1.2s cubic-bezier(0.19, 1, 0.22, 1) 0.4s forwards;
    }
    @keyframes fadeUp { to { opacity: 1; transform: none; } }

    .eyebrow {
      display: inline-flex; align-items: center; gap: 0.75rem;
      font-size: 0.72rem; letter-spacing: 0.35em; text-transform: uppercase;
      color: var(--muted); margin-bottom: 2rem;
    }
    .eyebrow::before, .eyebrow::after {
      content: ""; width: 32px; height: 1px; background: var(--muted);
    }
    h1 {
      font-weight: 200;
      font-size: clamp(2rem, 5vw, 3.75rem);
      line-height: 1.1;
      letter-spacing: -0.015em;
      margin-bottom: 1.5rem;
    }
    h1 .accent { display: block; opacity: 0.65; font-style: italic; margin-top: 0.5rem; font-size: 0.5em; letter-spacing: 0.02em; }
    .sub {
      font-size: clamp(1rem, 1.35vw, 1.15rem);
      color: var(--muted);
      max-width: 520px;
      margin: 0 auto 3rem;
      line-height: 1.6;
    }

    .contacts {
      display: flex; flex-wrap: wrap; justify-content: center; gap: 0.85rem;
    }
    .contacts a {
      display: inline-flex; align-items: center; gap: 0.65rem;
      padding: 0.9rem 1.5rem;
      border: 1px solid rgba(255,255,255,0.35);
      font-size: 0.78rem; letter-spacing: 0.12em; text-transform: uppercase;
      transition: background 0.4s cubic-bezier(0.19,1,0.22,1), color 0.4s ease, border-color 0.4s ease;
    }
    .contacts a:hover { background: #fff; color: var(--ink); border-color: #fff; }
    .contacts a svg { width: 15px; height: 15px; }
    .contacts a.primary {
      background: #fff; color: var(--ink); border-color: #fff;
    }
    .contacts a.primary:hover { background: transparent; color: #fff; border-color: rgba(255,255,255,0.6); }

    /* Footer discret */
    footer {
      padding: 2rem clamp(1.25rem, 4vw, 3rem);
      display: flex; justify-content: space-between; flex-wrap: wrap; gap: 1rem;
      font-size: 0.72rem; letter-spacing: 0.1em; color: var(--muted);
    }
    footer a { color: var(--muted); transition: color 0.3s; }
    footer a:hover { color: #fff; }
    footer .legal a { margin-right: 1.25rem; }
    footer .legal a:last-child { margin-right: 0; }

    /* Lang toggle */
    .lang {
      display: inline-flex; align-items: center; gap: 0.35rem;
      font-size: 0.7rem; letter-spacing: 0.15em; text-transform: uppercase;
    }
    .lang button {
      background: none; border: 0; cursor: pointer; color: var(--muted);
      padding: 0.25rem 0.35rem; font: inherit; letter-spacing: inherit;
      transition: color 0.3s ease;
    }
    .lang button.active { color: #fff; font-weight: 500; }
    .lang span { opacity: 0.4; }

    @media (max-width: 560px) {
      header, footer { padding-left: 1rem; padding-right: 1rem; }
      .contacts a { padding: 0.75rem 1.1rem; font-size: 0.72rem; }
      footer { justify-content: center; text-align: center; }
    }
    @media (prefers-reduced-motion: reduce) {
      .bg { animation: none; }
      .card { animation: none; opacity: 1; transform: none; }
      .sig::after { animation: none; }
    }
  </style>
</head>
<body>

<div class="bg" aria-hidden="true"></div>

<header>

    <span class="sig" aria-hidden="true"></span>
  </a>
  <div class="lang" aria-label="Langue">
    <button class="active" data-lang="fr">FR</button>
    <span>/</span>
    <button data-lang="en">EN</button>

</header>

<main>
  <div class="card">
    <span class="eyebrow" data-i18n="eyebrow">StudioTM — Lyon</span>

    <div class="contacts">

        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
        Email
      </a>
      <a href="https://wa.me/33672256783" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12.04 2c-5.5 0-9.96 4.46-9.96 9.96 0 1.75.46 3.46 1.32 4.97L2 22l5.2-1.36c1.46.8 3.1 1.22 4.83 1.22h.01c5.5 0 9.96-4.46 9.96-9.96S17.54 2 12.04 2z"/></svg>
        WhatsApp
      </a>
      <a href="tel:+33672256783">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.91.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
        <span data-i18n="tel">Téléphone</span>
      </a>
      <a href="https://www.instagram.com/studiotm___/" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="2" width="20" height="20" rx="5" ry="5"/><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37zM17.5 6.5h.01"/></svg>
        Instagram
      </a>
      <a href="https://www.linkedin.com/in/tom-maradan" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M20.5 2h-17A1.5 1.5 0 002 3.5v17A1.5 1.5 0 003.5 22h17a1.5 1.5 0 001.5-1.5v-17A1.5 1.5 0 0020.5 2zM8 19H5V9h3zM6.5 7.5A1.75 1.75 0 118.25 5.75 1.76 1.76 0 016.5 7.5zM19 19h-3v-4.74c0-1.42-.6-1.93-1.38-1.93A1.74 1.74 0 0013 14.19a.66.66 0 000 .14V19h-3s0-9 0-10h3v1.35A3.28 3.28 0 0115.47 9c1.83 0 3.53 1 3.53 4z"/></svg>
        LinkedIn
      </a>
    </div>
  </div>
</main>

<footer>
  <span>© <span id="year"></span> StudioTM — Tom Maradan</span>
  <span class="legal">
    <a href="/mentions-legales/" data-i18n="ml">Mentions légales</a>
    <a href="/politique-confidentialite/" data-i18n="pc">Politique de confidentialité</a>
    <a href="/cgv/">CGV</a>
  </span>
</footer>

<script>
  document.getElementById('year').textContent = new Date().getFullYear();

  // Traduction simple FR/EN
  const DICT = {
    fr: {
      portfolio: 'Portfolio',
      eyebrow: 'StudioTM — Lyon',
      title: 'Nouvelle version<br>bientôt disponible.<span class="accent">L\'architecture qui prend de la hauteur.</span>',
      accent: "L'architecture qui prend de la hauteur.",
      sub: 'En attendant, discutons de votre projet — je réponds sous 48h.',
      tel: 'Téléphone', ml: 'Mentions légales', pc: 'Politique de confidentialité'
    },
    en: {
      portfolio: 'Portfolio',
      eyebrow: 'StudioTM — Lyon',
      title: 'A new version<br>coming soon.<span class="accent">Interior architecture, seen from above.</span>',
      accent: 'Interior architecture, seen from above.',
      sub: "In the meantime, let's talk about your project — I reply within 48 hours.",
      tel: 'Phone', ml: 'Legal notice', pc: 'Privacy policy'
    }
  };
  const initLang = localStorage.getItem('stm_lang') || 'fr';
  const apply = (lang) => {
    const d = DICT[lang] || DICT.fr;
    document.querySelectorAll('[data-i18n]').forEach(el => {
      const k = el.getAttribute('data-i18n');
      if (d[k] == null) return;
      const tag = el.tagName.toLowerCase();
      if (tag === 'h1' || tag === 'span' && k === 'accent') { el.innerHTML = d[k]; }
      else { el.innerHTML = d[k]; }
    });
    document.documentElement.setAttribute('lang', lang);
    document.querySelectorAll('.lang button').forEach(b => b.classList.toggle('active', b.dataset.lang === lang));
  };
  apply(initLang);
  document.querySelectorAll('.lang button').forEach(b => b.addEventListener('click', () => {
    const l = b.dataset.lang;
    localStorage.setItem('stm_lang', l);
    apply(l);
  }));
</script>

</body>
