<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>90 Grande Rue — Mercurey</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --ochre: #C8865A;
      --dark: #1a1a1a;
      --light: #f5f0eb;
      --mid: #8a7d70;
      --white: #ffffff;
    }

    html, body {
      width: 100%; height: 100%;
      font-family: 'Inter', sans-serif;
      background: var(--dark);
      color: var(--white);
      overflow: hidden;
    }

    /* ── ÉCRAN D'ATTENTE ── */
    #screen-waiting {
      position: fixed; inset: 0;
      display: flex;
      transition: opacity 0.8s ease;
    }

    .waiting-photo {
      position: absolute; inset: 0;
      background: url('assets/facade2.jpg') center center / cover no-repeat;
      filter: brightness(0.45);
    }

    .waiting-content {
      position: relative; z-index: 2;
      width: 100%; height: 100%;
      display: flex; flex-direction: column;
      justify-content: flex-end;
      padding: 64px 72px;
    }

    .tag {
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--ochre);
      margin-bottom: 20px;
    }

    .waiting-title {
      font-family: 'Playfair Display', serif;
      font-size: clamp(48px, 7vw, 88px);
      font-weight: 400;
      line-height: 1.05;
      color: var(--white);
      margin-bottom: 16px;
    }

    .waiting-subtitle {
      font-size: 16px;
      font-weight: 300;
      color: rgba(255,255,255,0.55);
      letter-spacing: 0.5px;
      margin-bottom: 56px;
      max-width: 500px;
    }

    .waiting-indicator {
      display: flex; align-items: center; gap: 14px;
    }

    .pulse-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--ochre);
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.7); }
    }

    .waiting-label {
      font-size: 13px;
      font-weight: 400;
      color: rgba(255,255,255,0.4);
      letter-spacing: 1px;
    }

    .corner-info {
      position: absolute;
      top: 56px; right: 72px;
      text-align: right;
      z-index: 2;
    }

    .corner-address {
      font-size: 13px;
      font-weight: 400;
      color: rgba(255,255,255,0.35);
      letter-spacing: 0.5px;
      line-height: 1.8;
    }

    /* ── ÉCRAN PERSONA ── */
    #screen-persona {
      position: fixed; inset: 0;
      display: flex;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.9s ease;
    }

    #screen-persona.visible {
      opacity: 1;
      pointer-events: auto;
    }

    .persona-photo-col {
      width: 52%;
      position: relative;
      overflow: hidden;
    }

    .persona-photo-bg {
      position: absolute; inset: 0;
      background-size: cover;
      background-position: center;
      transform: scale(1.05);
      transition: transform 8s ease;
    }

    #screen-persona.visible .persona-photo-bg {
      transform: scale(1);
    }

    .persona-photo-overlay {
      position: absolute; inset: 0;
      background: linear-gradient(to right, transparent 60%, var(--dark) 100%);
    }

    .persona-info-col {
      width: 48%;
      background: var(--dark);
      display: flex; flex-direction: column;
      justify-content: center;
      padding: 64px 72px 64px 56px;
    }

    .persona-eyebrow {
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 3.5px;
      text-transform: uppercase;
      color: var(--ochre);
      margin-bottom: 28px;
    }

    .persona-name {
      font-family: 'Playfair Display', serif;
      font-size: clamp(42px, 5vw, 68px);
      font-weight: 400;
      line-height: 1.08;
      color: var(--white);
      margin-bottom: 8px;
    }

    .persona-age {
      font-size: 15px;
      font-weight: 300;
      color: var(--ochre);
      margin-bottom: 32px;
      letter-spacing: 0.5px;
    }

    .persona-desc {
      font-size: 15px;
      line-height: 1.75;
      color: rgba(255,255,255,0.6);
      font-weight: 300;
      margin-bottom: 40px;
      max-width: 380px;
    }

    .persona-specs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px 32px;
      margin-bottom: 40px;
    }

    .spec-item {
      border-top: 1px solid rgba(255,255,255,0.1);
      padding-top: 14px;
    }

    .spec-label {
      font-size: 10px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--mid);
      margin-bottom: 6px;
    }

    .spec-value {
      font-size: 14px;
      font-weight: 400;
      color: var(--white);
    }

    .persona-tag-list {
      display: flex; flex-wrap: wrap; gap: 8px;
    }

    .persona-tag {
      font-size: 11px;
      font-weight: 400;
      letter-spacing: 0.5px;
      color: rgba(255,255,255,0.55);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 2px;
      padding: 5px 12px;
    }

    /* ── TRANSITION ── */
    #screen-waiting.hidden { opacity: 0; pointer-events: none; }

    /* ── NUMÉRO SCAN ── */
    .scan-counter {
      position: fixed;
      bottom: 32px; right: 40px;
      z-index: 10;
      display: flex; gap: 6px;
    }

    .scan-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: rgba(255,255,255,0.15);
      transition: background 0.4s;
    }

    .scan-dot.done { background: var(--ochre); }
  </style>
</head>
<body>

  <!-- ÉCRAN D'ATTENTE (projecteur au départ) -->
  <div id="screen-waiting">
    <div class="waiting-photo"></div>
    <div class="corner-info">
      <div class="corner-address">90 Grande Rue<br>71640 Mercurey<br>Saône-et-Loire</div>
    </div>
    <div class="waiting-content">
      <div class="tag">Conception sociale des habitats — CREAD 4</div>
      <h1 class="waiting-title">Une maison.<br>Trois destins.</h1>
      <p class="waiting-subtitle">Ancienne propriété de l'OPAC de Saône-et-Loire, restituée à la commune de Mercurey. Un bâtiment à réinventer.</p>
      <div class="waiting-indicator">
        <div class="pulse-dot"></div>
        <span class="waiting-label">En attente d'une clé</span>
      </div>
    </div>
  </div>

  <!-- ÉCRAN PERSONA -->
  <div id="screen-persona">
    <div class="persona-photo-col">
      <div class="persona-photo-bg" id="persona-photo"></div>
      <div class="persona-photo-overlay"></div>
    </div>
    <div class="persona-info-col">
      <div class="persona-eyebrow" id="persona-eyebrow">Résident · Appartement A</div>
      <h2 class="persona-name" id="persona-name">—</h2>
      <div class="persona-age" id="persona-age">—</div>
      <p class="persona-desc" id="persona-desc">—</p>
      <div class="persona-specs" id="persona-specs"></div>
      <div class="persona-tag-list" id="persona-tags"></div>
    </div>
  </div>

  <!-- Indicateur de progression (3 scans) -->
  <div class="scan-counter">
    <div class="scan-dot" id="dot-0"></div>
    <div class="scan-dot" id="dot-1"></div>
    <div class="scan-dot" id="dot-2"></div>
  </div>

  <!-- Firebase SDK -->
  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
    import { getDatabase, ref, onValue } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js';

    // ── REMPLACER PAR VOTRE CONFIG FIREBASE ──
    const firebaseConfig = {
      apiKey: "AIzaSyCQjIPdy6i_NZjH78ffiuZjUFW4cmlWp7o",
      authDomain: "mercurey-workshop.firebaseapp.com",
      databaseURL: "https://mercurey-workshop-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "mercurey-workshop",
      storageBucket: "mercurey-workshop.firebasestorage.app",
      messagingSenderId: "744676802442",
      appId: "1:744676802442:web:dc1cbe5179d859d4fb1273"
    };

    const PERSONAS = {
      lucas: {
        eyebrow: "Résident · Appartement A — Rez-de-chaussée",
        name: "Lucas",
        age: "20 ans — Apprenti CIFA Jean Lameloise",
        desc: "Lucas suit une formation en hôtellerie-restauration au CIFA de Mercurey. Chaque soir, il parcourait 35 km pour rentrer chez ses parents. Désormais, il habite à deux minutes à pied de son centre de formation.",
        photo: "assets/facade1.jpg", // remplacer par 3D
        specs: [
          { label: "Surface", value: "32 m²" },
          { label: "Type", value: "Studio aménagé" },
          { label: "Loyer", value: "320 €/mois" },
          { label: "Statut", value: "Logement social" },
        ],
        tags: ["Jeune actif", "Mobilité douce", "Espaces communs", "Jardin partagé"]
      },
      genevieve: {
        eyebrow: "Résidente · Appartement B — Rez-de-chaussée",
        name: "Geneviève",
        age: "74 ans — Mercurey depuis 1978",
        desc: "Geneviève vivait seule dans sa grande maison de 160 m² depuis le départ de ses enfants. La vendre était impensable. La quitter, une trahison. Ici, elle reste au village — avec moins à entretenir, et plus de monde autour.",
        photo: "assets/facade2.jpg",
        specs: [
          { label: "Surface", value: "58 m²" },
          { label: "Type", value: "T3 de plain-pied" },
          { label: "Loyer", value: "480 €/mois" },
          { label: "Statut", value: "Logement adapté" },
        ],
        tags: ["Senior autonome", "Plain-pied", "Jardin privatif", "Centre-village"]
      },
      raymond: {
        eyebrow: "Résident · Appartement C — Rez-de-chaussée",
        name: "Raymond",
        age: "71 ans — En fauteuil roulant depuis 2021",
        desc: "Raymond ne cherchait pas à déménager — il cherchait à rester. À rester à Mercurey, là où il a vendangé quarante ans. Un logement pensé pour lui : pas d'obstacle, pas de compromis, et vue sur les vignes.",
        photo: "assets/facade3.jpg",
        specs: [
          { label: "Surface", value: "62 m²" },
          { label: "Type", value: "T3 PMR" },
          { label: "Loyer", value: "490 €/mois" },
          { label: "Accessibilité", value: "Norme PMR complète" },
        ],
        tags: ["PMR", "Rez-de-chaussée", "Salle de bain adaptée", "Accès plain-pied"]
      }
    };

    const ORDER = ['lucas', 'genevieve', 'raymond'];

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const stateRef = ref(db, 'workshop');

    let lastPersona = null;

    onValue(stateRef, (snapshot) => {
      const data = snapshot.val();
      if (!data) return;

      const { current_persona, scan_count } = data;

      // Mettre à jour les dots
      for (let i = 0; i < 3; i++) {
        document.getElementById(`dot-${i}`).classList.toggle('done', i < (scan_count || 0));
      }

      if (current_persona && current_persona !== lastPersona) {
        lastPersona = current_persona;
        showPersona(current_persona);
      }
    });

    function showPersona(key) {
      const p = PERSONAS[key];
      if (!p) return;

      document.getElementById('persona-eyebrow').textContent = p.eyebrow;
      document.getElementById('persona-name').textContent = p.name;
      document.getElementById('persona-age').textContent = p.age;
      document.getElementById('persona-desc').textContent = p.desc;
      document.getElementById('persona-photo').style.backgroundImage = `url('${p.photo}')`;

      const specsEl = document.getElementById('persona-specs');
      specsEl.innerHTML = p.specs.map(s => `
        <div class="spec-item">
          <div class="spec-label">${s.label}</div>
          <div class="spec-value">${s.value}</div>
        </div>
      `).join('');

      const tagsEl = document.getElementById('persona-tags');
      tagsEl.innerHTML = p.tags.map(t => `<span class="persona-tag">${t}</span>`).join('');

      // Transition
      document.getElementById('screen-waiting').classList.add('hidden');
      document.getElementById('screen-persona').classList.add('visible');
    }
  </script>
</body>
</html>
