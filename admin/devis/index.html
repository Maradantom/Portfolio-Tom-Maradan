<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>StudioTM — Devis</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    /* ============================================================
       RESET + BASE
       ============================================================ */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      font-family: 'Outfit', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #f4f4f4;
      color: #111;
      line-height: 1.5;
      min-height: 100vh;
    }
    button, input, textarea, select { font-family: inherit; font-size: inherit; color: inherit; }

    /* ============================================================
       AUTH GATE
       ============================================================ */
    .auth-gate {
      position: fixed; inset: 0;
      background: #111;
      display: flex; align-items: center; justify-content: center;
      z-index: 9999;
    }
    .auth-gate.hidden { display: none; }
    .auth-box {
      background: #fff;
      padding: 2.5rem 2rem;
      border-radius: 12px;
      width: 100%; max-width: 360px;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    }
    .auth-box h1 { font-size: 1.3rem; font-weight: 600; margin-bottom: 0.4rem; letter-spacing: 0.3px; }
    .auth-box p { color: #777; font-size: 0.85rem; margin-bottom: 1.5rem; }
    .auth-box input {
      width: 100%; padding: 0.75rem 1rem;
      border: 1px solid #ddd; border-radius: 8px;
      font-size: 16px; margin-bottom: 0.6rem;
      outline: none; transition: border-color 0.2s;
    }
    .auth-box input:focus { border-color: #111; }
    .auth-box button {
      width: 100%; padding: 0.75rem;
      background: #111; color: #fff; border: none;
      border-radius: 8px; font-weight: 600; cursor: pointer;
      transition: background 0.2s;
    }
    .auth-box button:hover { background: #333; }
    .auth-error { color: #c00; font-size: 0.8rem; margin-top: 0.5rem; min-height: 1em; }

    /* ============================================================
       TOP BAR
       ============================================================ */
    .topbar {
      background: #fff;
      border-bottom: 1px solid #e5e5e5;
      padding: 0.9rem 1.5rem;
      display: flex; align-items: center; justify-content: space-between;
      position: sticky; top: 0; z-index: 100;
    }
    .topbar-left { display: flex; align-items: center; gap: 1rem; }
    .topbar-logo { height: 26px; width: auto; display: block; }
    .topbar-sep { color: #ccc; }
    .topbar-title { font-size: 0.95rem; color: #666; }
    .topbar-actions { display: flex; gap: 0.5rem; }
    .btn {
      padding: 0.55rem 1rem;
      border: 1px solid #ddd;
      background: #fff;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s;
    }
    .btn:hover { background: #f5f5f5; border-color: #bbb; }
    .btn-primary { background: #111; color: #fff; border-color: #111; }
    .btn-primary:hover { background: #333; border-color: #333; }
    .btn-danger:hover { background: #fee; border-color: #f99; color: #c00; }

    /* ============================================================
       LAYOUT : 2 COLONNES
       ============================================================ */
    .layout {
      display: grid;
      grid-template-columns: 380px 1fr;
      gap: 1.5rem;
      padding: 1.5rem;
      max-width: 1500px;
      margin: 0 auto;
      align-items: start;
    }
    @media (max-width: 900px) {
      .layout { grid-template-columns: 1fr; }
    }

    /* ============================================================
       FORM PANEL
       ============================================================ */
    .form-panel {
      background: #fff;
      border-radius: 12px;
      padding: 1.3rem;
      position: sticky; top: 80px;
      max-height: calc(100vh - 100px);
      overflow-y: auto;
      border: 1px solid #e5e5e5;
    }
    @media (max-width: 900px) {
      .form-panel { position: static; max-height: none; }
    }
    .form-panel h2 {
      font-size: 0.7rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: #999;
      margin: 1.5rem 0 0.7rem;
      padding-bottom: 0.4rem;
      border-bottom: 1px solid #eee;
    }
    .form-panel h2:first-child { margin-top: 0; }
    .form-panel label {
      display: block;
      font-size: 0.75rem;
      color: #666;
      margin: 0.6rem 0 0.2rem;
      font-weight: 500;
    }
    .form-panel input, .form-panel textarea, .form-panel select {
      width: 100%;
      padding: 0.55rem 0.7rem;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: 0.85rem;
      background: #fafafa;
      transition: all 0.15s;
    }
    .form-panel input:focus, .form-panel textarea:focus, .form-panel select:focus {
      outline: none; border-color: #111; background: #fff;
    }
    .form-panel textarea { resize: vertical; min-height: 60px; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem; }
    .form-row-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 0.5rem; }

    /* Autocomplete adresse */
    .autocomplete-wrap { position: relative; }
    .autocomplete-list {
      position: absolute;
      top: 100%; left: 0; right: 0;
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 6px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.12);
      max-height: 220px; overflow-y: auto;
      z-index: 50; margin-top: 2px;
    }
    .autocomplete-item {
      padding: 0.55rem 0.7rem;
      font-size: 0.82rem;
      cursor: pointer;
      border-bottom: 1px solid #f0f0f0;
    }
    .autocomplete-item:last-child { border-bottom: none; }
    .autocomplete-item:hover { background: #f5f5f5; }
    .autocomplete-item .city { color: #999; font-size: 0.75rem; }

    /* Lignes prestations dans l'éditeur */
    .ligne-item {
      background: #fafafa;
      padding: 0.7rem;
      border-radius: 8px;
      margin-bottom: 0.5rem;
      border: 1px solid #eee;
    }
    .ligne-item-header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 0.4rem;
    }
    .ligne-num { font-size: 0.7rem; color: #999; font-weight: 600; }
    .ligne-remove {
      background: none; border: none;
      color: #c00; cursor: pointer;
      font-size: 0.75rem;
      padding: 0.2rem 0.5rem; border-radius: 4px;
    }
    .ligne-remove:hover { background: #fee; }
    .ligne-item input, .ligne-item textarea, .ligne-item select {
      background: #fff; margin-bottom: 0.3rem;
    }
    .ligne-add {
      width: 100%;
      padding: 0.55rem;
      border: 1px dashed #ccc;
      background: transparent;
      border-radius: 6px;
      color: #666; cursor: pointer;
      font-size: 0.85rem; margin-top: 0.4rem;
    }
    .ligne-add:hover { border-color: #111; color: #111; background: #f5f5f5; }

    /* ============================================================
       PREVIEW = le devis rendu (imprimable)
       Layout compact pour tenir sur 1 page A4
       ============================================================ */
    .preview-wrapper { display: flex; flex-direction: column; align-items: center; gap: 1.5rem; }

    .devis-page {
      background: #fff;
      width: 100%;
      max-width: 210mm;
      min-height: 297mm;
      padding: 12mm 15mm;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08);
      color: #111;
      font-size: 9pt;
      line-height: 1.45;
      display: flex; flex-direction: column;
    }
    .devis-page.page-2 { padding: 15mm 20mm; }

    /* --- HEADER --- */
    .devis-header {
      display: flex; justify-content: space-between; align-items: flex-start;
      padding-bottom: 0.6rem;
      border-bottom: 2px solid #111;
      margin-bottom: 0.9rem;
    }
    .devis-brand img { height: 30px; width: auto; display: block; margin-bottom: 0.2rem; }
    .devis-brand p {
      color: #666; font-size: 0.7rem;
      text-transform: uppercase; letter-spacing: 0.15em;
    }
    .devis-meta { text-align: right; font-size: 0.8rem; }
    .devis-meta .num { font-size: 1.05rem; font-weight: 600; margin-bottom: 0.1rem; letter-spacing: 0.3px; }
    .devis-meta .date { color: #666; }
    .devis-meta .valid { color: #666; font-size: 0.72rem; margin-top: 0.15rem; }

    /* --- PARTIES --- */
    .devis-parties {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.5rem;
      margin-bottom: 0.9rem;
    }
    .party h3 {
      font-size: 0.6rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      color: #999;
      margin-bottom: 0.3rem;
    }
    .party .name { font-weight: 600; font-size: 0.88rem; margin-bottom: 0.15rem; }
    .party .info { color: #444; font-size: 0.75rem; white-space: pre-line; line-height: 1.5; }

    /* --- OBJET --- */
    .devis-objet {
      background: #fafafa;
      padding: 0.5rem 0.8rem;
      border-left: 3px solid #111;
      margin-bottom: 0.9rem;
      border-radius: 0 4px 4px 0;
    }
    .devis-objet .label {
      font-size: 0.6rem; text-transform: uppercase;
      letter-spacing: 0.12em; color: #999; margin-bottom: 0.1rem;
    }
    .devis-objet .value { font-weight: 500; font-size: 0.88rem; }
    .devis-objet .projet { color: #666; font-size: 0.78rem; margin-top: 0.1rem; }

    /* --- TABLEAU PRESTATIONS --- */
    .devis-lignes {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 0.6rem;
      font-size: 0.8rem;
    }
    .devis-lignes thead th {
      background: #111;
      color: #fff;
      padding: 0.45rem 0.55rem;
      text-align: left;
      font-size: 0.68rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      font-weight: 500;
    }
    .devis-lignes thead th.num-col { width: 5%; text-align: center; }
    .devis-lignes thead th.qte-col { width: 8%; text-align: center; }
    .devis-lignes thead th.unite-col { width: 10%; text-align: center; }
    .devis-lignes thead th.pu-col { width: 14%; text-align: right; }
    .devis-lignes thead th.total-col { width: 14%; text-align: right; }
    .devis-lignes tbody td {
      padding: 0.5rem 0.55rem;
      border-bottom: 1px solid #eee;
      vertical-align: top;
    }
    .devis-lignes tbody td.num { text-align: center; color: #999; font-size: 0.75rem; }
    .devis-lignes tbody td.qte { text-align: center; }
    .devis-lignes tbody td.unite { text-align: center; color: #666; font-size: 0.75rem; }
    .devis-lignes tbody td.pu { text-align: right; white-space: nowrap; }
    .devis-lignes tbody td.total { text-align: right; font-weight: 500; white-space: nowrap; }
    .ligne-titre { font-weight: 600; font-size: 0.82rem; margin-bottom: 0.1rem; }
    .ligne-desc { color: #666; font-size: 0.72rem; line-height: 1.4; }

    /* --- TOTAUX --- */
    .devis-totaux {
      display: flex; justify-content: flex-end;
      margin-top: 0.4rem; margin-bottom: 0.8rem;
    }
    .devis-totaux table {
      min-width: 240px;
      border-collapse: collapse;
    }
    .devis-totaux td {
      padding: 0.3rem 0.7rem;
      font-size: 0.82rem;
    }
    .devis-totaux td:first-child { color: #666; }
    .devis-totaux td:last-child { text-align: right; font-weight: 500; white-space: nowrap; }
    .devis-totaux tr.total-final td {
      background: #111; color: #fff;
      font-weight: 600;
      font-size: 0.95rem;
      padding: 0.55rem 0.7rem;
    }

    /* --- MENTIONS + IBAN + SIGNATURE (bas de devis) --- */
    .devis-bas {
      margin-top: auto;
      padding-top: 0.6rem;
    }
    .devis-mentions {
      background: #fafafa;
      padding: 0.55rem 0.75rem;
      border-radius: 4px;
      font-size: 0.72rem;
      color: #444;
      margin-bottom: 0.7rem;
      line-height: 1.55;
    }
    .devis-mentions strong { color: #111; }

    .devis-paiement {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
      margin-bottom: 0.7rem;
      font-size: 0.75rem;
    }
    .paiement-block h4 {
      font-size: 0.6rem;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: #999;
      margin-bottom: 0.2rem;
      font-weight: 600;
    }
    .paiement-block p { color: #444; line-height: 1.5; }

    .devis-signature {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.5rem;
      padding-top: 0.7rem;
      border-top: 1px solid #eee;
    }
    .signature-block { font-size: 0.75rem; }
    .signature-block .title { font-weight: 600; margin-bottom: 0.35rem; font-size: 0.78rem; }
    .signature-block .line { color: #999; font-size: 0.68rem; }
    .signature-space { height: 32px; border-bottom: 1px dotted #ccc; margin-top: 0.4rem; }

    .devis-footer {
      margin-top: 0.7rem;
      padding-top: 0.5rem;
      border-top: 1px solid #eee;
      text-align: center;
      font-size: 0.62rem;
      color: #999;
      line-height: 1.5;
    }

    /* --- PAGE 2 : CGV --- */
    .cgv h2 {
      font-size: 1.05rem;
      font-weight: 600;
      margin-bottom: 0.7rem;
      padding-bottom: 0.4rem;
      border-bottom: 2px solid #111;
      letter-spacing: 0.3px;
    }
    .cgv h3 {
      font-size: 0.78rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #111;
      margin-top: 0.85rem;
      margin-bottom: 0.3rem;
    }
    .cgv p {
      font-size: 0.78rem;
      color: #333;
      line-height: 1.55;
      margin-bottom: 0.4rem;
    }
    .cgv ul {
      font-size: 0.78rem;
      color: #333;
      padding-left: 1.2rem;
      margin-bottom: 0.4rem;
    }
    .cgv ul li { line-height: 1.55; margin-bottom: 0.15rem; }
    .cgv .cgv-header { text-align: center; font-size: 0.7rem; color: #999; margin-bottom: 1rem; }

    /* ============================================================
       PRINT
       ============================================================ */
    @media print {
      @page { size: A4; margin: 0; }
      html, body { background: #fff !important; height: auto !important; }
      .topbar, .form-panel, .auth-gate, .save-toast { display: none !important; }
      .layout { display: block !important; padding: 0 !important; max-width: none !important; margin: 0 !important; }
      .preview-wrapper { display: block !important; gap: 0 !important; }
      .devis-page {
        box-shadow: none !important;
        max-width: none !important;
        width: 100% !important;
        min-height: 0 !important;
        height: auto !important;
        page-break-after: avoid;
        page-break-inside: avoid;
        break-after: avoid;
        break-inside: avoid;
        padding: 10mm 12mm !important;
        print-color-adjust: exact;
        -webkit-print-color-adjust: exact;
      }
      .devis-lignes thead th,
      .devis-totaux tr.total-final td { print-color-adjust: exact; -webkit-print-color-adjust: exact; }
    }

    /* ============================================================
       TOAST
       ============================================================ */
    .save-toast {
      position: fixed;
      bottom: 20px; right: 20px;
      background: #111; color: #fff;
      padding: 0.7rem 1.2rem;
      border-radius: 8px;
      font-size: 0.85rem;
      box-shadow: 0 8px 24px rgba(0,0,0,0.2);
      opacity: 0;
      transform: translateY(10px);
      transition: all 0.25s;
      pointer-events: none;
      z-index: 9998;
    }
    .save-toast.show { opacity: 1; transform: translateY(0); }
  </style>
</head>
<body>

<!-- ============================================================
     AUTH GATE
     ============================================================ -->
<div id="auth" class="auth-gate">
  <form class="auth-box" onsubmit="return checkAuth(event)">
    <h1>StudioTM · Admin</h1>
    <p>Accès protégé</p>
    <input type="password" id="pwd" placeholder="Mot de passe" autofocus autocomplete="current-password">
    <button type="submit">Entrer</button>
    <div class="auth-error" id="auth-error"></div>
  </form>
</div>

<!-- ============================================================
     TOP BAR
     ============================================================ -->
<div class="topbar">
  <div class="topbar-left">
    <img src="/photosite/logo/Noirlong.webp" alt="StudioTM" class="topbar-logo">
    <span class="topbar-sep">·</span>
    <span class="topbar-title">Devis</span>
  </div>
  <div class="topbar-actions">
    <button class="btn btn-danger" onclick="resetDevis()">Nouveau</button>
    <button class="btn" onclick="saveDevis()">Sauvegarder</button>
    <button class="btn btn-primary" onclick="window.print()">Imprimer / PDF</button>
  </div>
</div>

<!-- ============================================================
     LAYOUT : form (gauche) + preview (droite)
     ============================================================ -->
<div class="layout">

  <!-- ===== FORM PANEL ===== -->
  <div class="form-panel">

    <h2>Numéro & dates</h2>
    <label>Numéro de devis</label>
    <input type="text" id="f-numero" oninput="render()">
    <label>Date d'émission</label>
    <input type="date" id="f-date" oninput="render()">
    <label>Validité (jours)</label>

    <h2>Client (destinataire)</h2>

    <label>Adresse (tape pour rechercher — rue sur la 1ère ligne, CP+ville sur la 2ème)</label>
    <div class="autocomplete-wrap">
      <textarea id="f-client-adresse" oninput="onAdresseInput(this.value)" autocomplete="off" placeholder="10 rue de la République&#10;69000 Lyon" rows="2"></textarea>
      <div class="autocomplete-list" id="adresse-suggestions" style="display:none;"></div>
    </div>
    <label>Complément d'adresse (optionnel)</label>
    <input type="text" id="f-client-adresse2" oninput="render()" placeholder="Bâtiment B, Étage 3...">
    <label>SIRET du client (optionnel — pour un pro)</label>
    <input type="text" id="f-client-siret" oninput="render()" placeholder="123 456 789 00012">
    <label>Email</label>
    <input type="email" id="f-client-email" oninput="render()" placeholder="contact@hmnop.fr">
    <label>Téléphone</label>
    <input type="tel" id="f-client-tel" oninput="render()" placeholder="+33 4 12 34 56 78">

    <h2>Objet du devis</h2>
    <label>Objet</label>
    <input type="text" id="f-objet" oninput="render()" placeholder="Sous-traitance — Conception & Visualisation intérieure">
    <label>Projet (détails)</label>
    <input type="text" id="f-projet" oninput="render()" placeholder="Rénovation complète + surélévation — 160 m²">
    <label>Lieu du projet (optionnel)</label>
    <input type="text" id="f-lieu" oninput="render()" placeholder="Lyon, France">

    <h2>Prestations</h2>
    <div id="lignes-editor"></div>
    <button class="ligne-add" onclick="ajouterLigne()">+ Ajouter une prestation</button>

    <h2>Modalités</h2>
    <label>Modalités de paiement</label>
    <textarea id="f-paiement" oninput="render()" placeholder="Ex: 30 % à la commande, solde à la livraison. Virement bancaire."></textarea>
    <label>Délai d'exécution estimé</label>
    <input type="text" id="f-delai" oninput="render()" placeholder="Ex: 15-20 jours répartis sur ~2 mois à compter de l'acceptation">

    <h2>Notes (optionnel)</h2>
    <textarea id="f-notes" oninput="render()" placeholder="Notes complémentaires visibles sur le devis..."></textarea>

  </div>

  <!-- ===== PREVIEW PANEL (1 page A4) ===== -->
  <div class="preview-wrapper">
    <div class="devis-page" id="devis-page-1"></div>
  </div>

</div>

<div class="save-toast" id="toast">Devis sauvegardé ✓</div>

<script>
// ============================================================
// AUTH
// ============================================================
const PWD_HASH = 'cb98aae9699415ea2c0885fb17244fdd70ed4a8538dc805c27af29eea7708b20';

async function sha256(str) {
  const buf = new TextEncoder().encode(str);
  const hashBuf = await crypto.subtle.digest('SHA-256', buf);
  return Array.from(new Uint8Array(hashBuf)).map(b => b.toString(16).padStart(2, '0')).join('');
}

async function checkAuth(e) {
  e.preventDefault();
  const pwd = document.getElementById('pwd').value;
  const hash = await sha256(pwd);
  if (hash === PWD_HASH) {
    sessionStorage.setItem('stm-auth', '1');
    document.getElementById('auth').classList.add('hidden');
    initDevis();
  } else {
    document.getElementById('auth-error').textContent = 'Mot de passe incorrect';
    document.getElementById('pwd').value = '';
  }
  return false;
}

if (sessionStorage.getItem('stm-auth') === '1') {
  document.getElementById('auth').classList.add('hidden');
}

// ============================================================
// EMETTEUR (infos StudioTM — modifie ici pour changer partout)
// ============================================================
const EMETTEUR = {
  nom: 'Tom Maradan (EI)',       // mention EI obligatoire depuis 2022 (Décret 2022-725)
  societe: 'StudioTM',
  adresse: '6 chemin des Ardillaux\n69720 Saint-Bonnet-de-Mure',
  siret: '99180546600018',
  ape: '7410Z',                  // Activités spécialisées de design
  email: 'contact@studiotm.fr',
  telephone: '+33 6 72 25 67 83',
  site: 'studiotm.fr',
  // À COMPLÉTER PAR TOM :
  iban: 'FR76 __________________________',
  bic: '__________',
  banque: 'Nom de ta banque',
  assureur: '',
  numPolice: '',
  couvertureGeo: 'France'
};

// ============================================================
// NUMÉROTATION AUTO STM-YYYY-NNN
// ============================================================
function nextDevisNumber() {
  const year = new Date().getFullYear();
  const key = `stm-devis-counter-${year}`;
  let counter = parseInt(localStorage.getItem(key) || '0', 10) + 1;
  return `STM-${year}-${String(counter).padStart(3, '0')}`;
}
function incrementCounter(numero) {
  const match = numero.match(/^STM-(\d{4})-(\d+)$/);
  if (!match) return;
  localStorage.setItem(`stm-devis-counter-${match[1]}`, parseInt(match[2], 10));
}

// ============================================================
// LIGNES
// ============================================================
const UNITES = ['forfait', 'jour', 'heure', 'unité', 'm²', 'ml', 'lot'];

function ajouterLigne(titre = '', description = '', quantite = 1, unite = 'forfait', prixUnitaire = 0) {
  state.lignes.push({ titre, description, quantite, unite, prixUnitaire });
  renderLignesEditor();
  render();
}
function supprimerLigne(idx) {
  state.lignes.splice(idx, 1);
  renderLignesEditor();
  render();
}
function updateLigne(idx, champ, value) {
  if (champ === 'quantite' || champ === 'prixUnitaire') {
    state.lignes[idx][champ] = parseFloat(value) || 0;
  } else {
    state.lignes[idx][champ] = value;
  }
  render();
}

function renderLignesEditor() {
  const container = document.getElementById('lignes-editor');
  container.innerHTML = state.lignes.map((l, i) => `
    <div class="ligne-item">
      <div class="ligne-item-header">
        <span class="ligne-num">Prestation ${i + 1}</span>
        <button class="ligne-remove" onclick="supprimerLigne(${i})">Supprimer</button>
      </div>
      <input type="text" placeholder="Titre" value="${escapeHtml(l.titre)}"
        oninput="updateLigne(${i}, 'titre', this.value)">
      <textarea placeholder="Description (optionnelle)"
        oninput="updateLigne(${i}, 'description', this.value)">${escapeHtml(l.description)}</textarea>
      <div class="form-row-3">
        <input type="number" step="0.01" placeholder="Qté" value="${l.quantite || ''}"
          oninput="updateLigne(${i}, 'quantite', this.value)" title="Quantité">
        <select onchange="updateLigne(${i}, 'unite', this.value)" title="Unité">
          ${UNITES.map(u => `<option value="${u}" ${l.unite === u ? 'selected' : ''}>${u}</option>`).join('')}
        </select>
        <input type="number" step="0.01" placeholder="PU HT" value="${l.prixUnitaire || ''}"
          oninput="updateLigne(${i}, 'prixUnitaire', this.value)" title="Prix unitaire HT">
      </div>
    </div>
  `).join('');
}

// ============================================================
// FORMATTERS
// ============================================================
function formatMontant(n) {
  return n.toLocaleString('fr-FR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' €';
}
function formatQte(n) {
  return n.toLocaleString('fr-FR', { minimumFractionDigits: 0, maximumFractionDigits: 2 });
}
function formatDate(iso) {
  if (!iso) return '';
  const [y, m, d] = iso.split('-');
  return `${d}/${m}/${y}`;
}
function addDays(iso, days) {
  if (!iso) return '';
  const d = new Date(iso);
  d.setDate(d.getDate() + (days || 0));
  return d.toISOString().slice(0, 10);
}
function formatSiret(s) {
  return s.replace(/(\d{3})(\d{3})(\d{3})(\d{5})/, '$1 $2 $3 $4');
}
function escapeHtml(s) {
  if (s == null) return '';
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// ============================================================
// AUTOCOMPLETE ADRESSE — API BAN gouvernementale
// ============================================================
let adresseDebounce = null;
function onAdresseInput(query) {
  render();
  const list = document.getElementById('adresse-suggestions');
  clearTimeout(adresseDebounce);
  if (!query || query.length < 3) { list.style.display = 'none'; return; }
  adresseDebounce = setTimeout(async () => {
    try {
      const url = `https://api-adresse.data.gouv.fr/search/?q=${encodeURIComponent(query)}&limit=5&autocomplete=1`;
      const res = await fetch(url);
      const data = await res.json();
      if (!data.features || !data.features.length) { list.style.display = 'none'; return; }
      list.innerHTML = data.features.map(f => {
        const p = f.properties;
        return `<div class="autocomplete-item"
                     onclick="selectAdresse('${escapeHtml(p.name)}', '${escapeHtml(p.postcode)}', '${escapeHtml(p.city)}')">
                  <div>${escapeHtml(p.name)}</div>
                  <div class="city">${escapeHtml(p.postcode)} ${escapeHtml(p.city)}</div>
                </div>`;
      }).join('');
      list.style.display = 'block';
    } catch (e) { list.style.display = 'none'; }
  }, 300);
}
function selectAdresse(rue, cp, ville) {
  document.getElementById('f-client-adresse').value = `${rue}\n${cp} ${ville}`;
  document.getElementById('adresse-suggestions').style.display = 'none';
  render();
  autoSaveDraft();
}
document.addEventListener('click', (e) => {
  if (!e.target.closest('.autocomplete-wrap')) {
    const list = document.getElementById('adresse-suggestions');
    if (list) list.style.display = 'none';
  }
});

function saveDevis() {
  syncFromForm();
  const key = `stm-devis-${state.numero}`;
  localStorage.setItem(key, JSON.stringify(state));
  incrementCounter(state.numero);
  showToast('Devis sauvegardé ✓');
}
function migrateState(s) {
  // Migration ancien format ligne (montant seul) -> nouveau (quantite/unite/prixUnitaire)
  if (s && Array.isArray(s.lignes)) {
    s.lignes = s.lignes.map(l => {
      if (l.quantite === undefined && l.prixUnitaire === undefined && l.montant !== undefined) {
        return { titre: l.titre || '', description: l.description || '', quantite: 1, unite: 'forfait', prixUnitaire: l.montant };
      }
      return {
        titre: l.titre || '',
        description: l.description || '',
        quantite: l.quantite != null ? l.quantite : 1,
        unite: l.unite || 'forfait',
        prixUnitaire: l.prixUnitaire != null ? l.prixUnitaire : 0
      };
    });
  }
  if (s && s.client) {
    s.client.adresse2 = s.client.adresse2 || '';
    s.client.siret = s.client.siret || '';
    s.client.email = s.client.email || s.client.contact || '';
    s.client.tel = s.client.tel || '';
  }
  s.lieu = s.lieu || '';
  s.paiement = s.paiement || '';
  s.delai = s.delai || '';
  return s;
}

function loadCurrentDevis() {
  const draft = localStorage.getItem('stm-devis-draft');
  if (draft) {
    try {
      state = migrateState(JSON.parse(draft));
      syncToForm();
      renderLignesEditor();
      render();
      return true;
    } catch (e) {}
  }
  return false;
}
function autoSaveDraft() {
  syncFromForm();
  localStorage.setItem('stm-devis-draft', JSON.stringify(state));
}
function resetDevis() {
  if (!confirm('Créer un nouveau devis ? Le devis en cours sera perdu si non sauvegardé.')) return;
  state = {
    numero: nextDevisNumber(),
    date: new Date().toISOString().slice(0, 10),
    validite: 30,
    client: { nom: '', adresse: '', adresse2: '', siret: '', email: '', tel: '' },
    objet: '',
    projet: '',
    lieu: '',
    lignes: [],
    paiement: '',
    delai: '',
    notes: ''
  };
  localStorage.removeItem('stm-devis-draft');
  syncToForm();
  renderLignesEditor();
  render();
}
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 1800);
}

    syncToForm();
    renderLignesEditor();
    render();
  }
  document.querySelectorAll('input, textarea, select').forEach(el => {
    el.addEventListener('input', autoSaveDraft);
    el.addEventListener('change', autoSaveDraft);
  });
}

if (sessionStorage.getItem('stm-auth') === '1') { initDevis(); }
</script>

</body>
</html>
