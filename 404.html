<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page introuvable — Tom Maradan | StudioTM</title>
  <meta name="description" content="Désolé, cette page n'existe pas ou a été déplacée. Retournez à l'accueil pour découvrir le portfolio.">
  <meta name="robots" content="noindex">

  <link rel="icon" type="image/svg+xml" href="/favicon/favicon-v2.svg">
  <link rel="icon" type="image/png" sizes="96x96" href="/favicon/favicon-96x96-v2.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/favicon/apple-touch-icon-v2.png">

  <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/main.css">

  <style>
    :root { --bg: #fafafa; --fg: #111; --muted: #777; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Outfit', sans-serif;
      background: var(--bg);
      color: var(--fg);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .err-wrap {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 6rem 1.5rem 4rem;
    }
    .err {
      text-align: center;
      max-width: 600px;
    }
    .err-code {
      font-size: clamp(5rem, 18vw, 9rem);
      font-weight: 700;
      letter-spacing: -0.04em;
      line-height: 1;
      color: var(--fg);
      margin-bottom: 1rem;
    }
    .err-title {
      font-size: clamp(1.2rem, 3vw, 1.6rem);
      font-weight: 600;
      margin-bottom: 0.8rem;
    }
    .err-text {
      color: var(--muted);
      font-size: 0.95rem;
      line-height: 1.6;
      margin-bottom: 2.5rem;
    }
    .err-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.8rem;
      justify-content: center;
    }
    .err-btn {
      display: inline-block;
      padding: 0.8rem 1.6rem;
      border-radius: 30px;
      font-weight: 600;
      font-size: 0.9rem;
      text-decoration: none;
      transition: all 0.25s ease;
    }
    .err-btn.primary {
      background: var(--fg);
      color: #fff;
      border: 1px solid var(--fg);
    }
    .err-btn.primary:hover { background: #333; }
    .err-btn.ghost {
      background: transparent;
      color: var(--fg);
      border: 1px solid #ddd;
    }
    .err-btn.ghost:hover { background: #f0f0f0; }
  </style>
</head>
<body>

  <!-- Barre de nav -->
  <div data-include="header"></div>

  <main class="err-wrap">
    <div class="err">
      <p class="err-code">404</p>
      <h1 class="err-title">Cette page n'existe pas</h1>
      <p class="err-text">
        L'URL que vous avez tapée est introuvable, ou la page a peut-être été déplacée.<br>
        Retournez à l'accueil pour découvrir mon portfolio.
      </p>
      <div class="err-actions">
        <a href="/" class="err-btn primary">← Retour à l'accueil</a>
        <a href="/projets/" class="err-btn ghost">Voir mes projets</a>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <div data-include="footer"></div>

  <!-- Icônes sociales flottantes -->
  <div data-include="footer-socials"></div>

  <script src="/assets/js/main.js" defer></script>
</body>
</html>
